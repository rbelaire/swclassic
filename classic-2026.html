<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Classic 2026 - Recap</title>
  <link rel="stylesheet" href="css/styles.css?v=20270907">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b6b3a">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="The Classic">
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>

  <style>
    .recap-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      font-weight: 700;
      font-size: 0.85em;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--masters-green);
      text-decoration: none;
    }
    .recap-back:hover { text-decoration: underline; }

    .result-banner {
      text-align: center;
      padding: 24px 20px;
      border-radius: var(--radius-lg);
      margin-bottom: 28px;
      background: var(--green-tint);
      border: 1px solid var(--color-line);
      border-top: 4px solid var(--masters-green);
    }
    .result-banner h3 {
      font-size: clamp(1.4em, 3.5vw, 2em);
      color: var(--masters-green);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .result-banner .final-score {
      font-size: clamp(1.4em, 4vw, 2.2em);
      font-weight: 800;
      margin: 10px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .final-score .fs-dash { color: var(--color-muted); font-weight: 400; }
    .hsc-green-text { color: var(--team-green); }
    .hsc-red-text { color: var(--team-red); }
    .final-score .winner-score { font-weight: 900; }

    /* Summary stat cards */
    .recap-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
      gap: clamp(12px, 2.5vw, 18px);
      margin-bottom: 24px;
    }
    .recap-stat {
      background: var(--color-card);
      border: 1px solid var(--color-line);
      border-top: 4px solid var(--masters-green);
      border-radius: var(--radius-md);
      padding: 18px 16px;
      text-align: center;
    }
    .recap-stat-label {
      font-size: 0.72em;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      color: var(--color-muted);
      margin-bottom: 8px;
    }
    .recap-stat-value {
      font-size: clamp(1.6em, 5vw, 2.2em);
      font-weight: 900;
      line-height: 1;
      color: var(--masters-black);
      font-variant-numeric: tabular-nums;
    }
    .recap-stat-value .rs-sep { color: var(--color-line); font-weight: 700; }
    .recap-stat-sub {
      font-size: 0.8em;
      color: var(--color-muted);
      margin-top: 8px;
    }

    /* Highlights */
    .recap-highlights {
      list-style: none;
      padding: 0;
      margin: 0 0 24px;
      display: grid;
      gap: 8px;
    }
    .recap-highlights li {
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-left: 3px solid var(--masters-green);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: clamp(0.92em, 2vw, 1.02em);
      line-height: 1.5;
    }

    /* Compact results table */
    .recap-results {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }
    .recap-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      background: var(--color-card);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }
    .rr-p { font-weight: 700; font-size: clamp(0.9em, 2.2vw, 1.05em); min-width: 0; }
    .rr-left { text-align: right; }
    .rr-right { text-align: left; }
    .rr-green { color: var(--team-green); }
    .rr-red { color: var(--team-red); }
    .rr-win { font-weight: 900; }
    .rr-win::after { content: " ✓"; font-size: 0.75em; }
    .rr-score {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: var(--masters-black);
      background: var(--color-surface);
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 0.95em;
    }
    .rr-score .rr-dash { color: var(--color-muted); }

    .recap-note {
      text-align: center;
      font-style: italic;
      color: var(--color-muted);
      margin: 18px 0 0;
      font-size: 0.95em;
    }

    /* Match detail cards (shared look with History) */
    .history-match {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 14px 18px;
      background: var(--color-card);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
    }
    .history-match .h-player {
      font-weight: 700;
      color: var(--masters-green);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .history-match .h-player:first-child { text-align: right; justify-content: flex-end; }
    .history-match .h-player:last-child { text-align: left; justify-content: flex-start; }
    .h-avatar {
      width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--masters-green); background: var(--color-surface); flex-shrink: 0;
    }
    .history-match .h-player.h-winner { color: var(--masters-black); }
    .history-match .h-vs { font-size: 0.8em; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
    .history-match .h-score { font-size: 0.85em; opacity: 0.7; }

    .h-scorecard {
      background: var(--color-card);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      padding: 12px 14px 14px;
      margin: -4px 0 20px;
    }
    .hsc-legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
    .hsc-chip { font-size: 0.8em; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(0,0,0,0.1); color: #fff; }
    .hsc-nine { margin-top: 8px; }
    .hsc-nine-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.72em; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--masters-green); font-weight: 700; margin-bottom: 4px;
    }
    .hsc-nine-res { color: var(--masters-black); font-weight: 700; letter-spacing: 0.5px; text-transform: none; }
    .hsc-row { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
    .hsc-cell {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 5px; padding: 4px 0; font-weight: 700; line-height: 1.1;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .hsc-h { font-size: 0.78em; }
    .hsc-p { font-size: 0.62em; opacity: 0.7; font-weight: 600; }
    .hsc-green { background: var(--team-green); color: #fff; }
    .hsc-red { background: var(--team-red); color: #fff; }
    .hsc-tie { background: #d8d8d8; color: #333; }
    .hsc-empty { background: #f1f4f2; color: #bbb; }
    .hsc-none { background: #888; color: #fff; }

    @media (max-width: 480px) {
      .hsc-p { display: none; }
      .hsc-h { font-size: 0.7em; }
      .history-match { grid-template-columns: 1fr; gap: 4px; text-align: center; padding: 12px 14px; }
      .history-match .h-player:first-child,
      .history-match .h-player:last-child { text-align: center; justify-content: center; }
      .h-avatar { width: 40px; height: 40px; }
    }
  </style>
</head>

<div class="hero">
  <h1>THE CLASSIC 2026</h1>
  <div class="subtitle" id="recap-sub">Season Recap</div>
</div>

<div class="container">
  <a href="history.html" class="recap-back">&larr; Back to History</a>
  <div id="recap">
    <p style="text-align:center; opacity:0.7;">Loading the 2026 recap&hellip;</p>
  </div>
</div>

<script src="classic-2026.js"></script>
</body>
</html>
