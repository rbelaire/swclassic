<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Classic 2026 - Live Leaderboard</title>
  <link rel="stylesheet" href="css/styles.css?v=20270912">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#17306e">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="The Classic">
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
  <style>
  @media (max-width: 768px) {
    .hero { margin-bottom: 0; padding-top: 28px; padding-bottom: 24px; }
    .section-header { margin: 24px 0 16px; }
    .section-header h2 { font-size: 1em; letter-spacing: 3px; padding: 8px 0; background: none; border: none; border-radius: 0; border-bottom: 2px solid #17306e; display: block; width: 100%; animation: none; }
    .scorebug { top: 0; border-radius: 0; margin-bottom: 0; }
    .scorebug-team { padding: 10px 14px; gap: 8px; }
    .refresh-controls { display: none; }
    .last-updated { background: none; border: none; border-radius: 0; padding: 8px 0; margin: 16px 0 4px; font-size: 0.8em; }
    .hero h1, .hero .subtitle, .hero .date, .hero p { animation: none; }
    .compact-holes-row, .pops-holes-row { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; gap: 4px; padding-bottom: 4px; }
    .matchup-names .player-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-close { width: 44px; height: 44px; font-size: 1em; top: 6px; right: 6px; }
  }

  /* Tighten the page — less air, denser rows (Sky/FOX broadcast bug). */
  .hero { padding-top: 34px; padding-bottom: 28px; }
  .scorebug { margin-bottom: 22px; }
  .section-header { margin: 22px 0 12px; }
  .timeline-wrap { margin-bottom: 26px; }
  /* Single full-width column of matches (like the broadcast bug). */
  .matches-grid { grid-template-columns: 1fr; gap: 16px; max-width: 720px; margin: 0 auto; }
  .foursome { padding: 12px 12px 14px; border-radius: 12px; }
  .foursome-header { margin-bottom: 10px; padding-bottom: 8px; }

  /* ===== Ryder Cup app scorebug rows =====
     Each match is a full-width row. The winning side flies a solid team-colour
     chevron pointing at the centre with the name reversed out in white; the
     other side stays white with dark type. A tied match greys both chevrons.
     Backgrounds are absolutely-positioned clip-path layers behind the text. */
  .matches-grid { gap: 14px; }
  .foursome { padding: 0; border: 1px solid var(--color-line); border-radius: 10px; overflow: hidden; }
  /* Thin black bar with small white lettering — a divider, not a heading. */
  .foursome-header {
    margin: 0; padding: 2px 12px;
    background: var(--masters-black);
    border-bottom: none;
    display: flex; align-items: center; justify-content: center;
  }
  .foursome-title {
    margin: 0; color: #fff;
    font-size: 0.62rem; font-weight: 800; letter-spacing: 0.16em;
    text-transform: uppercase; line-height: 1.2;
  }

  /* A match = two stacked nine-lines (front, then back), each a chevron with a
     black F9/B9 tab on the left. Two ~46px lines fill the height one big row
     used to. The back line is only emitted once the front nine is complete. */
  .match-pair { background: #fff; border-bottom: 3px solid var(--color-line); cursor: pointer; }
  .match-pair:last-child { border-bottom: 0; }
  .match-pair:hover { background: #fbfcfe; }

  .np-line {
    position: relative;
    display: grid;
    grid-template-columns: 2.6em 1fr;
    align-items: stretch;
    min-height: 46px;
  }
  .np-line + .np-line { border-top: 1px solid var(--color-line); }

  .np-tab {
    display: flex; align-items: center; justify-content: center;
    background: var(--masters-black); color: #fff;
    font-family: 'Archivo', system-ui, sans-serif;
    font-weight: 900; font-size: 0.7rem; letter-spacing: 0.04em;
  }

  .np-row { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; overflow: hidden; }

  /* Angled colour bands (chevrons), computed within the row (right of the tab). */
  .np-bg { position: absolute; top: 0; bottom: 0; width: calc(50% - 54px); z-index: 0; display: none; }
  .np-bg--left  { left: 0;  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); }
  .np-bg--right { right: 0; clip-path: polygon(18px 0, 100% 0, 100% 100%, 18px 100%, 0 50%); }
  .np-line.win-left  .np-bg--left,
  .np-line.win-right .np-bg--right,
  .np-line.tied .np-bg { display: block; }
  .np-line.win-left  .np-bg--left  { background: var(--cL); }
  .np-line.win-right .np-bg--right { background: var(--cR); }
  .np-line.tied .np-bg { background: #e6e8ee; }

  .np-side {
    position: relative; z-index: 1;
    display: flex; align-items: center; min-width: 0; padding: 6px 12px;
    font-family: 'Archivo', system-ui, sans-serif;
  }
  .np-side--left { justify-content: flex-start; }
  .np-side--right { justify-content: flex-end; }
  .np-name {
    font-weight: 700; font-size: clamp(0.95rem, 3.2vw, 1.2rem); letter-spacing: -0.01em;
    line-height: 1.05; color: var(--masters-black);
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .np-line.win-left  .np-side--left  .np-name,
  .np-line.win-right .np-side--right .np-name { color: #fff; }

  .np-center {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0; padding: 2px 6px; min-width: 80px; max-width: 104px; text-align: center;
    font-family: 'Archivo', system-ui, sans-serif;
  }
  .np-result { display: flex; align-items: baseline; justify-content: center; gap: 2px; line-height: 0.95; font-size: clamp(1.35rem, 5vw, 1.85rem); }
  .np-num { font-weight: 900; font-size: 1em; letter-spacing: -0.02em; color: var(--masters-black); }
  .np-suffix { font-weight: 800; font-size: 0.55em; letter-spacing: 0.2px; color: var(--masters-black); }
  .np-word { font-weight: 900; font-size: clamp(1.1rem, 4vw, 1.5rem); letter-spacing: 0.02em; color: var(--color-muted); line-height: 1; }
  .np-thru { font-size: 0.5rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted); line-height: 1; margin-top: 1px; }
  .np-line.win-left  .np-num, .np-line.win-left  .np-suffix { color: var(--cL); }
  .np-line.win-right .np-num, .np-line.win-right .np-suffix { color: var(--cR); }

  @media (max-width: 480px) {
    .np-line { min-height: 44px; }
    .np-bg { width: calc(50% - 50px); }
    .np-side { padding: 6px 9px; }
    .np-name { font-size: 0.98rem; }
    .np-center { min-width: 74px; max-width: 98px; }
    .np-result { font-size: 1.5rem; }
    .np-tab { font-size: 0.64rem; }
  }

  /* ===== Score timeline ===== */
  .timeline-wrap { margin-bottom: var(--gap-section); }
  .timeline-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    gap: clamp(12px, 2.5vw, 18px);
  }
  .tl-card {
    background: var(--color-card);
    border: 1px solid var(--color-line);
    border-radius: var(--radius-lg);
    padding: 14px 16px 10px;
    box-shadow: var(--shadow-sm);
  }
  .tl-title {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--color-muted);
    margin-bottom: 4px;
  }
  .tl-sub { font-size: 0.72rem; color: var(--color-muted); margin-bottom: 8px; }
  .tl-sub b.g { color: var(--team-green); }
  .tl-sub b.r { color: var(--team-red); }
  .tl-chart { width: 100%; height: auto; display: block; }
  .tl-empty { color: var(--color-muted); font-size: 0.85rem; text-align: center; padding: 24px 0; }
  .tl-axis { fill: var(--color-muted); font-size: 9px; font-weight: 600; }
  .tl-grid-line { stroke: var(--color-line); stroke-width: 1; }
  </style>
</head>

<nav class="navbar">
  <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">Menu</label>

    <a href="index.html" class="nav-link">Home</a>
    <a href="rules.html" class="nav-link">Rules</a>

    <a href="admin.html" class="nav-link">Admin</a>
  </div>
</nav>

<div class="hero">
  <h1>LIVE LEADERBOARD</h1>
  <div class="subtitle" id="event-subtitle">The Classic</div>
</div>

<div class="container">

  <!-- TEAM TOTALS SCOREBUG -->
  <div class="scorebug" id="scorebug">
    <div class="scorebug-team scorebug-team--green" id="team-green">
      <div class="scorebug-teamblock">
        <span class="scorebug-name" id="team-green-name">RED</span>
        <span class="scorebug-capt" id="team-green-capt"></span>
      </div>
      <span class="scorebug-score" id="team-green-score">0.0</span>
    </div>
    <div class="scorebug-divider">VS</div>
    <div class="scorebug-team scorebug-team--red" id="team-red">
      <div class="scorebug-teamblock">
        <span class="scorebug-name" id="team-red-name">BLUE</span>
        <span class="scorebug-capt" id="team-red-capt"></span>
      </div>
      <span class="scorebug-score" id="team-red-score">0.0</span>
    </div>
  </div>

  <div class="section-header">
    <h2>Individual Matches</h2>
  </div>

  <!-- MATCHES (the focus) -->
  <div class="matches-grid" id="matches-grid"></div>

  <!-- SCORE TIMELINE — charts sit below the leaderboard -->
  <div id="score-timeline" class="timeline-wrap" style="display:none;"></div>

  <div class="last-updated" id="last-updated"></div>

    <!-- AUTO-REFRESH CONTROLS -->
  <div class="refresh-controls" style="display:none">
    <div class="refresh-indicator" id="refresh-indicator">
      Loading scores...
    </div>
    <div class="refresh-buttons">
      <button id="manual-refresh-btn" onclick="manualRefresh()" class="refresh-btn">
        ⟳ Refresh Now
      </button>
      <button id="toggle-refresh-btn" onclick="toggleAutoRefresh()" class="refresh-btn">
        ⏸ Pause Updates
      </button>
    </div>
  </div>
  
</div>

<script src="teams.js"></script>
<script src="matchup-modal.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
