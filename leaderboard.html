<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Classic 2026 - Live Leaderboard</title>
  <link rel="stylesheet" href="css/styles.css?v=20270912">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#17306e">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="The Classic">
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
  <style>
  @media (max-width: 768px) {
    .hero { margin-bottom: 0; padding-top: 28px; padding-bottom: 24px; }
    .section-header { margin: 24px 0 16px; }
    .section-header h2 { font-size: 1em; letter-spacing: 3px; padding: 8px 0; background: none; border: none; border-radius: 0; border-bottom: 2px solid #17306e; display: block; width: 100%; animation: none; }
    .scorebug { top: 0; border-radius: 0; margin-bottom: 0; }
    .scorebug-team { padding: 10px 14px; gap: 8px; }
    .refresh-controls { display: none; }
    .last-updated { background: none; border: none; border-radius: 0; padding: 8px 0; margin: 16px 0 4px; font-size: 0.8em; }
    .hero h1, .hero .subtitle, .hero .date, .hero p { animation: none; }
    .compact-holes-row, .pops-holes-row { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; gap: 4px; padding-bottom: 4px; }
    .matchup-names .player-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-close { width: 44px; height: 44px; font-size: 1em; top: 6px; right: 6px; }
  }

  /* Tighten the page — less air, denser rows (Sky/FOX broadcast bug). */
  .hero { padding-top: 34px; padding-bottom: 28px; }
  .scorebug { margin-bottom: 22px; }
  .section-header { margin: 22px 0 12px; }
  .timeline-wrap { margin-bottom: 26px; }
  /* Single full-width column of matches (like the broadcast bug). */
  .matches-grid { grid-template-columns: 1fr; gap: 16px; max-width: 720px; margin: 0 auto; }
  .foursome { padding: 12px 12px 14px; border-radius: 12px; }
  .foursome-header { margin-bottom: 10px; padding-bottom: 8px; }

  /* ===== Ryder Cup app scorebug rows =====
     Each match is a full-width row. The winning side flies a solid team-colour
     chevron pointing at the centre with the name reversed out in white; the
     other side stays white with dark type. A tied match greys both chevrons.
     Backgrounds are absolutely-positioned clip-path layers behind the text. */
  .matches-grid { gap: 0; }
  .foursome { padding: 0; border: 1px solid var(--color-line); overflow: hidden; }
  /* Thin black bar with small white lettering — a divider, not a heading. */
  .foursome-header {
    margin: 0; padding: 5px 12px;
    background: var(--masters-black);
    border-bottom: none;
    display: flex; align-items: center; justify-content: center;
  }
  .foursome-title {
    margin: 0; color: #fff;
    font-size: 0.7rem; font-weight: 800; letter-spacing: 0.18em;
    text-transform: uppercase; line-height: 1.3;
  }

  .matchup {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    min-height: 84px;
    background: #fff;
    border-bottom: 1px solid var(--color-line);
    margin: 0;
    overflow: hidden;
    cursor: pointer;
  }
  .matchup:last-child { border-bottom: 0; }
  .matchup:hover { background: #fbfcfe; }

  /* Angled colour bands (chevrons). Hidden until a side is marked. */
  .mp-bg { position: absolute; top: 0; bottom: 0; width: calc(50% - 66px); z-index: 0; display: none; }
  .mp-bg--left  { left: 0;  clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 50%, calc(100% - 24px) 100%, 0 100%); }
  .mp-bg--right { right: 0; clip-path: polygon(24px 0, 100% 0, 100% 100%, 24px 100%, 0 50%); }
  .matchup.win-left  .mp-bg--left,
  .matchup.win-right .mp-bg--right,
  .matchup.tied .mp-bg { display: block; }
  .matchup.win-left  .mp-bg--left  { background: var(--cL); }
  .matchup.win-right .mp-bg--right { background: var(--cR); }
  .matchup.tied .mp-bg { background: #e6e8ee; }

  .mp-side {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px 16px;
  }
  .mp-side--left { justify-content: flex-start; }
  .mp-side--right { justify-content: flex-end; }
  .mp-name {
    font-weight: 800; font-size: clamp(1rem, 3.4vw, 1.35rem);
    letter-spacing: 0.2px; line-height: 1.1; color: var(--masters-black);
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .matchup.win-left  .mp-side--left  .mp-name,
  .matchup.win-right .mp-side--right .mp-name { color: #fff; }

  /* Team dot before/after the name; hollow ring = winning/leading. */
  .mp-dot { flex-shrink: 0; width: 14px; height: 14px; border-radius: 50%; }
  .mp-dot--left  { background: var(--cL); }
  .mp-dot--right { background: var(--cR); }
  .mp-dot--hollow { background: transparent; border: 3px solid currentColor; }
  .mp-side--left .mp-dot--hollow  { color: var(--cL); }
  .mp-side--right .mp-dot--hollow { color: var(--cR); }
  /* On a filled colour band the winner's hollow ring reads in white. */
  .matchup.win-left  .mp-side--left  .mp-dot--hollow,
  .matchup.win-right .mp-side--right .mp-dot--hollow { color: #fff; }

  .mp-center {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 4px 6px; min-width: 108px; max-width: 128px; text-align: center;
  }
  .mp-result { display: flex; align-items: baseline; justify-content: center; gap: 3px; line-height: 1; }
  .mp-num { font-weight: 900; font-size: clamp(1.7rem, 6vw, 2.5rem); color: var(--masters-black); }
  .mp-suffix { font-weight: 800; font-size: clamp(0.8rem, 2.6vw, 1.05rem); letter-spacing: 0.5px; color: var(--masters-black); }
  .mp-word { font-weight: 900; font-size: clamp(1.2rem, 4.4vw, 1.7rem); letter-spacing: 2px; color: var(--color-muted); }
  .matchup.win-left  .mp-num, .matchup.win-left  .mp-suffix { color: var(--cL); }
  .matchup.win-right .mp-num, .matchup.win-right .mp-suffix { color: var(--cR); }
  .mp-sub {
    font-weight: 700; font-size: 0.6rem; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--color-muted); line-height: 1;
    white-space: nowrap;
  }
  /* Front / back nine chips (our format is two nine-hole matches). Each chip is
     coloured by that nine's leader; the live nine gets a white ring. The front
     chip keeps the settled front result on screen once play reaches the back. */
  .mp-nines { display: flex; gap: 6px; margin-top: 5px; }
  .mp-nine {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 6px; border-radius: 6px; line-height: 1;
  }
  .mp-nine i { font-style: normal; font-size: 0.5rem; font-weight: 800; letter-spacing: 0.04em; opacity: 0.85; }
  .mp-nine b { font-size: 0.68rem; font-weight: 900; }

  @media (max-width: 480px) {
    .matchup { min-height: 76px; }
    /* Pull the chevron tips back so the centre keeps a clear white gap. */
    .mp-bg { width: calc(50% - 64px); }
    .mp-bg--left  { clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); }
    .mp-bg--right { clip-path: polygon(18px 0, 100% 0, 100% 100%, 18px 100%, 0 50%); }
    .mp-side { gap: 7px; padding: 8px 9px; }
    .mp-name { font-size: 1rem; }
    .mp-center { min-width: 90px; max-width: 120px; padding: 4px 2px; }
    .mp-num { font-size: 1.7rem; }
    .mp-sub { font-size: 0.54rem; letter-spacing: 0.03em; }
    .mp-nines { gap: 5px; margin-top: 4px; }
    .mp-nine { padding: 2px 5px; }
    .mp-nine b { font-size: 0.62rem; }
    .mp-dot { width: 12px; height: 12px; }
  }

  /* ===== Score timeline ===== */
  .timeline-wrap { margin-bottom: var(--gap-section); }
  .timeline-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    gap: clamp(12px, 2.5vw, 18px);
  }
  .tl-card {
    background: var(--color-card);
    border: 1px solid var(--color-line);
    border-radius: var(--radius-lg);
    padding: 14px 16px 10px;
    box-shadow: var(--shadow-sm);
  }
  .tl-title {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--color-muted);
    margin-bottom: 4px;
  }
  .tl-sub { font-size: 0.72rem; color: var(--color-muted); margin-bottom: 8px; }
  .tl-sub b.g { color: var(--team-green); }
  .tl-sub b.r { color: var(--team-red); }
  .tl-chart { width: 100%; height: auto; display: block; }
  .tl-empty { color: var(--color-muted); font-size: 0.85rem; text-align: center; padding: 24px 0; }
  .tl-axis { fill: var(--color-muted); font-size: 9px; font-weight: 600; }
  .tl-grid-line { stroke: var(--color-line); stroke-width: 1; }
  </style>
</head>

<body>

<nav class="navbar">
  <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">Menu</label>
  <div class="nav-container">
    <a href="index.html" class="nav-link">Tournament Format</a>
    <a href="draft.html" class="nav-link">Draft Board</a>
    <a href="leaderboard.html" class="nav-link active" title="v2">Live Leaderboard</a>
    <a href="history.html" class="nav-link">History</a>
    <a href="admin.html" class="nav-link admin-link">Admin</a>
  </div>
</nav>

<div class="hero">
  <h1>LIVE LEADERBOARD</h1>
  <div class="subtitle" id="event-subtitle">The Classic</div>
</div>

<div class="container">
  <div id="weatherWidget"></div>

  <!-- TEAM TOTALS SCOREBUG -->
  <div class="scorebug" id="scorebug">
    <div class="scorebug-team scorebug-team--green" id="team-green">
      <div class="scorebug-teamblock">
        <span class="scorebug-name" id="team-green-name">RED</span>
        <span class="scorebug-capt" id="team-green-capt"></span>
      </div>
      <span class="scorebug-score" id="team-green-score">0.0</span>
    </div>
    <div class="scorebug-divider">VS</div>
    <div class="scorebug-team scorebug-team--red" id="team-red">
      <div class="scorebug-teamblock">
        <span class="scorebug-name" id="team-red-name">BLUE</span>
        <span class="scorebug-capt" id="team-red-capt"></span>
      </div>
      <span class="scorebug-score" id="team-red-score">0.0</span>
    </div>
  </div>

  <div class="section-header">
    <h2>Individual Matches</h2>
  </div>

  <!-- MATCHES (the focus) -->
  <div class="matches-grid" id="matches-grid"></div>

  <!-- SCORE TIMELINE — charts sit below the leaderboard -->
  <div id="score-timeline" class="timeline-wrap" style="display:none;"></div>

  <div class="last-updated" id="last-updated"></div>

    <!-- AUTO-REFRESH CONTROLS -->
  <div class="refresh-controls" style="display:none">
    <div class="refresh-indicator" id="refresh-indicator">
      Loading scores...
    </div>
    <div class="refresh-buttons">
      <button id="manual-refresh-btn" onclick="manualRefresh()" class="refresh-btn">
        ⟳ Refresh Now
      </button>
      <button id="toggle-refresh-btn" onclick="toggleAutoRefresh()" class="refresh-btn">
        ⏸ Pause Updates
      </button>
    </div>
  </div>
  
</div>

<script src="weather.js"></script>
<script src="teams.js"></script>
<script src="matchup-modal.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
