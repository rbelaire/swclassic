<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Classic 2026 - Live Leaderboard</title>
  <link rel="stylesheet" href="css/styles.css?v=20270907">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b6b3a">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="The Classic">
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
  <style>
  @media (max-width: 768px) {
    .hero { margin-bottom: 0; padding-top: 28px; padding-bottom: 24px; }
    .section-header { margin: 24px 0 16px; }
    .section-header h2 { font-size: 1em; letter-spacing: 3px; padding: 8px 0; background: none; border: none; border-radius: 0; border-bottom: 2px solid #006747; display: block; width: 100%; animation: none; }
    .scorebug { top: 0; border-radius: 0; margin-bottom: 0; }
    .scorebug-team { padding: 10px 14px; gap: 8px; }
    .refresh-controls { display: none; }
    .last-updated { background: none; border: none; border-radius: 0; padding: 8px 0; margin: 16px 0 4px; font-size: 0.8em; }
    .hero h1, .hero .subtitle, .hero .date, .hero p { animation: none; }
    .compact-holes-row, .pops-holes-row { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; gap: 4px; padding-bottom: 4px; }
    .matchup-names .player-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-close { width: 44px; height: 44px; font-size: 1em; top: 6px; right: 6px; }
  }

  /* Player headshots on matchup cards: avatar stacked above the name so the
     name keeps the full column width and never collides with the scores.
     Name properties are set explicitly here to override the global
     .player-name rule used by the ranking cards. */
  .matchup-player {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; min-width: 0;
  }
  /* Fallback name shown only if a headshot fails to load. */
  .matchup-player .player-name {
    min-width: 0; max-width: 100%;
    margin: 0; padding: 0;
    text-align: center;
    font-size: clamp(0.8em, 1.7vw, 0.95em);
    font-weight: 800;
    letter-spacing: 0;
    text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lb-avatar {
    width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--team-green); background: var(--color-surface); flex-shrink: 0;
  }
  .matchup-player--left .lb-avatar { border-color: var(--team-green); }
  .matchup-player--right .lb-avatar { border-color: var(--team-red); }
  @media (max-width: 480px) {
    .lb-avatar { width: 48px; height: 48px; }
  }

  /* Team color runs across the row: green in from the left (Team one),
     red in from the right (Team two) — instant team identification. */
  .foursome .matchup {
    background: linear-gradient(90deg,
      var(--green-tint) 0%, #ffffff 30%, #ffffff 70%, var(--red-tint) 100%);
  }

  /* Center column: match-play status (hero) + point pills + holes played */
  .matchup-center {
    display: flex; flex-direction: column; align-items: center;
    gap: 5px; min-width: 0;
  }
  .mp-status {
    font-weight: 800;
    font-size: clamp(1.05rem, 3.6vw, 1.4rem);
    letter-spacing: 0.5px;
    line-height: 1;
    white-space: nowrap;
    color: var(--masters-green);
  }
  .mp-status--as { color: #6b7280; letter-spacing: 1px; }
  .mp-status--none { color: #b8b8b8; }
  .mp-thru {
    font-size: clamp(0.6rem, 2vw, 0.72rem);
    color: #6b7280; letter-spacing: 0.5px; text-transform: uppercase;
  }
  /* Slightly smaller point pills so the status reads as primary */
  .matchup-center .matchup-scores { gap: 6px; }
  .matchup-center .nine-score { padding: 3px 9px; }

  @media (max-width: 480px) {
    .matchup-row { gap: 6px; }
    .matchup-center { gap: 4px; }
    .matchup-center .nine-score { padding: 2px 7px; }
  }

  /* ===== Score timeline ===== */
  .timeline-wrap { margin-bottom: var(--gap-section); }
  .timeline-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    gap: clamp(12px, 2.5vw, 18px);
  }
  .tl-card {
    background: var(--color-card);
    border: 1px solid var(--color-line);
    border-radius: var(--radius-lg);
    padding: 14px 16px 10px;
    box-shadow: var(--shadow-sm);
  }
  .tl-title {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--color-muted);
    margin-bottom: 4px;
  }
  .tl-sub { font-size: 0.72rem; color: var(--color-muted); margin-bottom: 8px; }
  .tl-sub b.g { color: var(--team-green); }
  .tl-sub b.r { color: var(--team-red); }
  .tl-chart { width: 100%; height: auto; display: block; }
  .tl-empty { color: var(--color-muted); font-size: 0.85rem; text-align: center; padding: 24px 0; }
  .tl-axis { fill: var(--color-muted); font-size: 9px; font-weight: 600; }
  .tl-grid-line { stroke: var(--color-line); stroke-width: 1; }
  </style>
</head>

<body>

<nav class="navbar">
  <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">Menu</label>
  <div class="nav-container">
    <a href="index.html" class="nav-link">Tournament Format</a>
    <a href="draft.html" class="nav-link">Draft Board</a>
    <a href="leaderboard.html" class="nav-link active" title="v2">Live Leaderboard</a>
    <a href="history.html" class="nav-link">History</a>
    <a href="admin.html" class="nav-link admin-link">Admin</a>
  </div>
</nav>

<div class="hero">
  <h1>LIVE LEADERBOARD</h1>
  <div class="subtitle" id="event-subtitle">The Classic</div>
</div>

<div class="container">
  <div id="weatherWidget"></div>

  <!-- TEAM TOTALS SCOREBUG -->
  <div class="scorebug" id="scorebug">
    <div class="scorebug-team scorebug-team--green" id="team-green">
      <span class="scorebug-name" id="team-green-name">GREEN</span>
      <span class="scorebug-score" id="team-green-score">0.0</span>
    </div>
    <div class="scorebug-divider">VS</div>
    <div class="scorebug-team scorebug-team--red" id="team-red">
      <span class="scorebug-name" id="team-red-name">RED</span>
      <span class="scorebug-score" id="team-red-score">0.0</span>
    </div>
  </div>

  <!-- SCORE TIMELINE (live snapshots + hole-by-hole momentum) -->
  <div id="score-timeline" class="timeline-wrap" style="display:none;"></div>

  <div class="section-header">
    <h2>Individual Matches</h2>
  </div>

  <!-- MATCHES -->
  <div class="matches-grid" id="matches-grid"></div>

  <div class="last-updated" id="last-updated"></div>

    <!-- AUTO-REFRESH CONTROLS -->
  <div class="refresh-controls" style="display:none">
    <div class="refresh-indicator" id="refresh-indicator">
      Loading scores...
    </div>
    <div class="refresh-buttons">
      <button id="manual-refresh-btn" onclick="manualRefresh()" class="refresh-btn">
        ⟳ Refresh Now
      </button>
      <button id="toggle-refresh-btn" onclick="toggleAutoRefresh()" class="refresh-btn">
        ⏸ Pause Updates
      </button>
    </div>
  </div>
  
</div>

<script src="weather.js"></script>
<script src="teams.js"></script>
<script src="matchup-modal.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
